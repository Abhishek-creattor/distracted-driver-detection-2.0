[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "distracted-driver-detection"
version = "1.0.0"
description = "Offline distracted driver detection with face recognition and MongoDB"
readme = "README.md"
requires-python = ">=3.9"
authors = [{name = "Driver Monitoring Team"}]
dependencies = [
  "opencv-python>=4.8.0",
  "face-recognition>=1.3.0",
  "mediapipe>=0.10.9",
  "numpy>=1.24.0",
  "pymongo>=4.6.0",
  "PyYAML>=6.0.1",
  "scipy>=1.11.0",
  "ultralytics>=8.2.0"
]

[project.scripts]
ddd-register = "ddd.cli:register_cli"
ddd-calibrate = "ddd.cli:calibrate_cli"
ddd-monitor = "ddd.cli:monitor_cli"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
